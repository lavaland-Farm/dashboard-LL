<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dashboard Greenhouse · Lavaland Farmhouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --navy:#1f3864;--navy2:#172a4d;--blue:#4472C4;--blue-l:#e9effa;--org:#ED7D31;--org-l:#fdeee3;
  --bg:#f3f5f9;--card:#fff;--line:#e2e7ef;--line2:#eef1f6;--txt:#1b2333;--mut:#6b7486;--mut2:#98a0b0;
  --ok:#2e7d4f;--ok-l:#e6f3ec;--bad:#b42318;--bad-l:#fdecea;--warn:#8a5a00;--warn-l:#fff4d6;
  --r:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- kerangka ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--navy) 232px,var(--bg) 232px)}
.side{background:var(--navy);color:#cfd8ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .lg{width:34px;height:34px;border-radius:8px;background:var(--org);display:grid;place-items:center;color:#fff}
.brand .lg svg{width:20px;height:20px;fill:#fff}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{display:block;font-size:11.5px;color:#9fb0cf}
nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
nav .nl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8193b5;padding:8px 12px 6px}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:9px 12px;color:#cfd8ea;font-size:14px}
nav button svg{width:18px;height:18px;fill:currentColor;opacity:.85;flex:none}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--org)}
nav button .cnt{margin-left:auto;font-size:11px;background:var(--org);color:#fff;border-radius:9px;padding:0 7px;line-height:18px}
.sfoot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9fb0cf}
.sfoot b{display:block;color:#fff;font-size:13px;font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 36px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.ph h1{margin:0;font-size:22px;font-weight:650;color:var(--navy);letter-spacing:-.2px}
.ph p{margin:3px 0 0;color:var(--mut);font-size:13.5px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.content{padding:24px 36px 48px;max-width:1440px;width:100%}
.tab{display:none}.tab.on{display:block}

/* ---------- komponen ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:20px;min-width:0}
.phd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.phd h3{margin:0;font-size:15px;font-weight:650;color:var(--txt)}
.phd .muted{font-size:12.5px}
.pbd{padding:16px 18px}
.pbd.np{padding:0}
.muted{color:var(--mut)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
.sech h2{margin:0;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.7px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px;align-items:start}
.g2>.panel,.g3>.panel,.g21>.panel,.g12>.panel{margin-bottom:0}
.gap{height:20px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.kpi.o:before{background:var(--org)}.kpi.n:before{background:var(--navy)}.kpi.g:before{background:#9aa6bd}.kpi.k:before{background:var(--ok)}
.kpi .kl{font-size:12.5px;color:var(--mut);font-weight:500}
.kpi .kv{font-size:28px;font-weight:650;color:var(--navy);line-height:1.15;margin-top:6px;letter-spacing:-.4px}
.kpi .kv small{font-size:14px;font-weight:500;color:var(--mut);margin-left:3px}
.kpi .ks{font-size:12px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;line-height:18px;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.berjalan{background:var(--blue-l);color:var(--navy)}
.badge.selesai{background:#eef0f4;color:#5a6478}
.badge.rencana{background:var(--org-l);color:#b0510f}
.badge.late{background:var(--bad-l);color:var(--bad)}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.tag{display:inline-block;font-size:11.5px;border-radius:5px;padding:1px 7px;background:#f0f3f8;color:#465068;margin-right:4px;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:7px;padding:8px 15px;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.sec{background:#fff;color:var(--txt);border-color:#cfd6e2}
.btn.sec:hover{background:#f6f8fb;filter:none}
.btn.del{background:#fff;color:var(--bad);border-color:#efc2bd}
.btn.del:hover{background:var(--bad-l);filter:none}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.blk{width:100%}
.lnk{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;padding:0}
.lnk:hover{text-decoration:underline}

.seg{display:inline-flex;background:#e9edf4;border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 13px;font-size:13px;color:#4a5468;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);background:#f7f9fc;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.tb td.w{white-space:normal}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr[data-ec]{cursor:pointer}
.tb tbody tr:hover td{background:#f8fafd}
.tb .r{text-align:right}.tb .c{text-align:center}
.tb .b{font-weight:600}
.tscroll{overflow-x:auto}

.dl{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;font-size:13.5px;margin:0}
.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:500}
.kvl .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kvl .kv:last-child{border-bottom:0}
.kvl .kv span{color:var(--mut)}.kvl .kv b{font-weight:600;text-align:right}

.bar{height:8px;background:#e7ebf2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.o i{background:var(--org)}.bar.k i{background:var(--ok)}

.empty{color:var(--mut2);text-align:center;padding:28px 16px;font-size:13.5px}
.note{font-size:12.5px;color:var(--mut);padding:10px 18px 14px}

label.fl{display:block;font-size:12.5px;font-weight:600;color:#3a4458;margin:0 0 5px}
input,select,textarea{width:100%;font-size:14px;padding:8px 11px;border:1px solid #cfd6e2;border-radius:7px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(68,114,196,.15)}
textarea{resize:vertical}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.fg .full{grid-column:1/-1}

/* ---------- dialog ---------- */
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
#sheet.on{display:flex}
#sheet .dlg{background:#fff;border-radius:12px;width:min(760px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,23,42,.3)}
#sheet .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
#sheet .mh h3{margin:0;font-size:17px;color:var(--navy)}
#sheet .mh .x{border:0;background:none;font-size:22px;line-height:1;color:var(--mut);padding:2px 6px;border-radius:6px}
#sheet .mh .x:hover{background:#f0f3f8}
#sheet .mb{padding:20px 22px;overflow:auto}
#sheet .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 12px 12px}
#sheet .mf .sp{flex:1}
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
.mstrip div{background:#f8fafd;padding:10px 14px}
.mstrip span{display:block;font-size:11.5px;color:var(--mut)}
.mstrip b{font-size:15px;color:var(--navy)}

.toast{position:fixed;right:28px;bottom:28px;background:#1b2333;color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:60;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:none}

/* ---------- layar kecil ---------- */
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .seg{max-width:100%;overflow-x:auto}
  .side{position:sticky;height:auto;z-index:20}
  .brand{padding:12px 16px}
  nav{flex-direction:row;overflow-x:auto;padding:6px 8px}
  nav .nl{display:none}
  nav button{width:auto;flex:none}
  .sfoot{display:none}
  .ph{padding:18px 16px 14px;flex-direction:column;align-items:flex-start}
  .content{padding:16px}
  .g2,.g3{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{width:2px;height:12px;background:var(--org);border-radius:0}
.ghc .pbd{padding:18px}
.cur{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.hst{font-size:40px;font-weight:700;color:var(--navy);line-height:1;letter-spacing:-1px;margin-top:6px}
.hst span{font-size:15px;font-weight:600;color:var(--mut);margin-left:6px;letter-spacing:0}
.pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:16px}
.met{background:#fff;padding:11px 13px}
.met span{display:block;font-size:11.5px;color:var(--mut)}
.met b{display:block;font-size:15.5px;color:var(--txt);margin-top:2px;white-space:nowrap}
.met em{display:block;font-style:normal;font-size:11.5px;color:var(--mut2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghf{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2);background:#fafbfd;border-radius:0 0 var(--r) var(--r)}
.ghf>div{padding:12px 18px}
.ghf>div+div{border-left:1px solid var(--line2)}
.ghf span{display:block;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.ghf b{font-size:13.5px;color:var(--blue);cursor:pointer;margin-right:6px}
.ghf em{font-style:normal;font-size:12.5px;color:var(--mut)}
.tb tfoot td{border-top:1px solid var(--line);border-bottom:0;background:#f7f9fc}
.cz{display:grid;gap:9px}.czr{display:grid;grid-template-columns:minmax(0,320px) 1fr 54px 52px;gap:12px;align-items:center;font-size:13px}
.czr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.czr b{text-align:right}.czr em{font-style:normal;color:var(--mut);text-align:right;font-size:12px}
.tb.sticky thead th{position:sticky;top:0;z-index:1}.tb.sticky tfoot td{position:sticky;bottom:0}
.capc{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.capc .bar{width:56px;height:6px}
.g3 .mets{grid-template-columns:repeat(2,1fr)}
@media (max-width:1250px){.mets{grid-template-columns:repeat(2,1fr)}}

/* ===== Monitoring & sumber spreadsheet ===== */
.kpi.b:before{background:var(--bad)}
.kpi .ks.wr{white-space:normal;line-height:1.45}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:#9aa6bd}
.dot.ok{background:var(--ok)}.dot.warn{background:#d39a00}.dot.bad{background:var(--bad)}
.phd.wrap{flex-wrap:wrap}.phd h3 .muted{font-weight:400;font-size:12.5px}
.cvw{position:relative;min-width:0}.cvw canvas{display:block}
#tip{position:fixed;z-index:60;display:none;pointer-events:none;background:#172a4d;color:#fff;border-radius:8px;padding:9px 11px;font-size:12.5px;box-shadow:0 6px 20px rgba(16,24,40,.25);min-width:150px}
#tip em{display:block;font-style:normal;color:#b9c6e0;font-size:11.5px;margin-bottom:5px}
#tip div{display:flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.7}#tip i{width:9px;height:9px;border-radius:2px;flex:none}#tip b{margin-left:auto;padding-left:14px;font-weight:600}
.srcs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.src{font-size:12.5px;border-radius:999px;padding:4px 11px;background:#eef0f4;color:#5a6478;white-space:nowrap}
.src em{font-style:normal;opacity:.75;margin-left:3px}.src.ok{background:var(--ok-l);color:var(--ok)}.src.er{background:var(--warn-l);color:var(--warn)}.src.tm{background:none;color:var(--mut);padding-left:2px}
.tb.ln td,.tb.ln th{padding:8px 10px}.tb.ln td.ok{color:var(--txt)}.tb.ln td.warn{background:var(--warn-l);color:var(--warn);font-weight:600}.tb.ln td.bad{background:var(--bad-l);color:var(--bad);font-weight:600}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 5px 0 10px;vertical-align:-1px;border:1px solid var(--line)}.lg.ok{background:#fff}.lg.warn{background:var(--warn-l)}.lg.bad{background:var(--bad-l)}
.empty.big{padding:44px 20px}.empty.big b{display:block;color:var(--txt);font-size:15px;margin-bottom:6px}.empty.big p{max-width:560px;margin:0 auto 16px;line-height:1.55}
.mets.air{margin-top:10px}.mets.air b .dot{margin-right:5px}.metn{font-size:11.5px;color:var(--mut2);margin-top:6px}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.btn2 .btn{justify-content:center}
.shr{display:flex;gap:8px}.shr input{flex:1;min-width:0}
.shg{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px 10px;align-items:center;margin-top:10px;font-size:13px}.shg label{color:var(--mut)}.shg select{min-width:0;width:100%}
.okx{color:var(--ok);font-size:12.5px;white-space:nowrap}.erx{color:var(--bad);font-size:12.5px}
.tagx{display:inline-block;font-size:10.5px;font-weight:600;color:var(--ok);background:var(--ok-l);border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:1px}
a.btn{text-decoration:none}
.wbox{border:1px solid var(--line);background:#f7f9fc;border-radius:8px;padding:10px 13px;font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.wbox b{display:block;color:var(--txt);font-size:13.5px;margin-bottom:1px}.wbox.ok{background:var(--ok-l);border-color:#cfe6d8}.wbox.ok b{color:var(--ok)}
.wbox.bad{background:var(--bad-l);border-color:#f3c7c2;margin:14px 0 0}.wbox.bad b{color:var(--bad)}
.steps{margin:0 0 16px;padding-left:20px;font-size:13.5px;line-height:1.6}.steps li{margin-bottom:6px}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#eef1f6;border-radius:4px;padding:1px 5px}
.pmode{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:1px}
.pmode.tulis{background:var(--ok-l);color:var(--ok)}.pmode.baca{background:var(--warn-l);color:var(--warn)}.pmode.lokal,.pmode.belum{background:#eef0f4;color:#5a6478}
.btn svg{width:16px;height:16px;fill:currentColor}
@media (max-width:860px){.shg{grid-template-columns:1fr}.shg label{margin-top:4px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="lg"><svg viewBox="0 0 24 24"><path d="M12 3 2 10v11h20V10zm0 2.5 7 4.9V19h-3v-6H8v6H5v-8.6zM10 15h4v4h-4z"/></svg></div><div><b>Dashboard Greenhouse</b><small>Lavaland Farmhouse</small></div></div>
  <nav>
    <div class="nl">Menu</div>
    <button data-t="ring" class="on"><svg viewBox="0 0 24 24"><path d="M4 13h7V4H4zm0 7h7v-5H4zm9 0h7v-9h-7zm0-16v5h7V4z"/></svg>Ringkasan</button>
    <button data-t="siklus"><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 8v10h12V10zm0-4v2h12V6z"/></svg>Siklus tanam</button>
    <button data-t="pop"><svg viewBox="0 0 24 24"><path d="M12 2C8 6 6 9.5 6 12.5a6 6 0 0 0 5 5.9V22h2v-3.6a6 6 0 0 0 5-5.9C18 9.5 16 6 12 2zm0 3.2c2.6 3 4 5.4 4 7.3a4 4 0 0 1-3 3.9V11h-2v5.4a4 4 0 0 1-3-3.9c0-1.9 1.4-4.3 4-7.3z"/></svg>Populasi</button>
    <button data-t="mon"><svg viewBox="0 0 24 24"><path d="M3 3h2v16h16v2H3zm4 11 4-5 3 3 5-7 1.6 1.2-6.4 8.9-3-3L8.6 15z"/></svg>Monitoring</button>
    <button data-t="gh"><svg viewBox="0 0 24 24"><path d="M12 3 2 10v11h20V10zm0 2.5 7 4.9V19h-3v-6H8v6H5v-8.6zM10 15h4v4h-4z"/></svg>Greenhouse</button>
    <button data-t="atur"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>Pengaturan data</button>
  </nav>
  <div class="sfoot"><b id="sdate"></b><span id="ssync"></span></div>
</aside>
<div class="main">
  <header class="ph"><div><h1 id="pt"></h1><p id="ps"></p></div><div class="acts" id="pa"></div></header>
  <main class="content">
    <section id="t-ring" class="tab on"></section>

var GAS_SRC="/**\n * Penulis Dashboard Greenhouse Lavaland → spreadsheet FORM MONITORING\n * Menerima catatan dari laman dashboard lalu menuliskannya ke tab Populasi\n * di spreadsheet siklus yang dituju. Skrip berjalan atas nama akun Anda,\n * jadi hanya spreadsheet yang bisa Anda ubah yang bisa ditulis.\n *\n * 1. Ganti KODE_AKSES di bawah dengan kode rahasia Anda sendiri (minimal 8 karakter).\n * 2. Terapkan › Deployment baru › Aplikasi web\n *      Jalankan sebagai: Saya   ·   Yang memiliki akses: Siapa saja\n * 3. Salin URL aplikasi web ke laman: Pengaturan data › Penulisan ke spreadsheet.\n */\nconst KODE_AKSES = 'GANTI-DENGAN-KODE-ANDA';\nconst VERSI = 1;\n\nfunction doGet() {\n  return keluaran({ ok: true, app: 'lavaland-dashboard-writer', v: VERSI });\n}\n\nfunction doPost(e) {\n  const kunci = LockService.getScriptLock();\n  try {\n    const q = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    if (!KODE_AKSES || KODE_AKSES.indexOf('GANTI') === 0 || KODE_AKSES.length < 8)\n      return keluaran({ ok: false, err: 'Kode akses di skrip belum diganti (minimal 8 karakter).' });\n    if (q.key !== KODE_AKSES) return keluaran({ ok: false, err: 'Kode akses salah.' });\n    if (q.act === 'ping') return keluaran({ ok: true, v: VERSI });\n    kunci.waitLock(20000);\n    const ss = SpreadsheetApp.openById(q.ss);\n    const sh = ss.getSheets().filter(function (s) { return String(s.getSheetId()) === String(q.gid); })[0];\n    if (!sh) return keluaran({ ok: false, err: 'Tab Populasi tidak ditemukan di spreadsheet.' });\n    if (q.act === 'popAdd') return keluaran(tambahPopulasi(ss, sh, q));\n    if (q.act === 'popEdit') return keluaran(ubahPopulasi(ss, sh, q));\n    return keluaran({ ok: false, err: 'Perintah tidak dikenal.' });\n  } catch (err) {\n    return keluaran({ ok: false, err: String((err && err.message) || err) });\n  } finally {\n    try { kunci.releaseLock(); } catch (x) {}\n  }\n}\n\nfunction keluaran(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\n/* ---------- alat bantu ---------- */\nfunction huruf(c) { var s = ''; c++; while (c > 0) { var m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; }\nfunction serial(iso) { var p = String(iso).split('-').map(Number); return (Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(1899, 11, 30)) / 864e5; }\nfunction adaTanggal(x) { return x instanceof Date || (typeof x === 'number' && x > 40000 && x < 60000) || (typeof x === 'string' && /\\d/.test(x) && /[a-z]{3}|\\//i.test(x)); }\nfunction kosong(x) { return x === '' || x === null || x === undefined; }\nfunction angka(x) { return typeof x === 'number' ? x : (kosong(x) ? 0 : Number(String(x).replace(/\\./g, '').replace(',', '.')) || 0); }\n\n/* cari tabel populasi paling kiri: Tanggal | (Lokasi) | Deskripsi | Keluar (-) | Masuk (+) | Populasi */\nfunction tabel(sh) {\n  var rg = sh.getDataRange(), v = rg.getValues(), f = rg.getFormulas();\n  for (var i = 0; i < Math.min(v.length, 12); i++) for (var j = 0; j < v[i].length; j++) {\n    if (String(v[i][j]).trim().toLowerCase() !== 'tanggal') continue;\n    var c = { t: j }, hd = v[i];\n    for (var k = j + 1; k < Math.min(j + 7, hd.length); k++) {\n      var x = String(hd[k]).trim().toLowerCase();\n      if (c.k == null && /^keluar/.test(x)) c.k = k;\n      else if (c.m == null && /^masuk/.test(x)) c.m = k;\n      else if (c.p == null && /^populasi/.test(x)) c.p = k;\n      else if (c.d == null && /^(deskripsi|keterangan|kejadian)/.test(x)) c.d = k;\n      else if (c.l == null && /^lokasi/.test(x)) c.l = k;\n    }\n    if (c.k != null && c.p != null) {\n      if (c.d == null) c.d = c.l != null ? c.l + 1 : j + 1;\n      c.h = i; c.v = v; c.f = f;\n      c.w = Math.max(c.k, c.m == null ? 0 : c.m, c.p, c.d, c.l == null ? 0 : c.l) - j + 1;\n      return c;\n    }\n  }\n  throw new Error('Tabel populasi (Tanggal, Keluar, Populasi) tidak ditemukan di tab ini.');\n}\nfunction sel(T, i, k) { return T.v[i] ? T.v[i][k] : ''; }\nfunction rumus(T, i, k) { return T.f[i] ? T.f[i][k] : ''; }\nfunction barisTerakhir(T) { var a = -1; for (var i = T.h + 1; i < T.v.length; i++) if (adaTanggal(sel(T, i, T.t))) a = i; return a; }\nfunction barisSebelum(T, i) { for (var j = i - 1; j > T.h; j--) if (adaTanggal(sel(T, j, T.t))) return j; return -1; }\n/* Keluar ditulis negatif (=E+C+D) kecuali rumus sebelumnya memakai pola \"−Keluar\" */\nfunction keluarPositif(T, i) {\n  var r = rumus(T, i, T.p); if (!r) return false;\n  return new RegExp('-\\\\s*\\\\$?' + huruf(T.k) + '\\\\$?' + (i + 1) + '(?!\\\\d)').test(r);\n}\nfunction rumusPopulasi(T, prev, r, pos) {\n  return '=' + huruf(T.p) + (prev + 1) + (pos ? '-' : '+') + huruf(T.k) + r + (T.m != null ? '+' + huruf(T.m) + r : '');\n}\nfunction tulisBaris(sh, T, r, q, prevIdx, pos) {\n  var nKel = Math.abs(angka(q.kel)), nMas = Math.abs(angka(q.mas));\n  sh.getRange(r, T.t + 1).setValue(serial(q.tgl));\n  if (T.l != null) {\n    var lk = q.lok != null ? q.lok : String(sel(T, prevIdx, T.l) || '');\n    sh.getRange(r, T.l + 1).setValue(/nursery/i.test(lk) ? '' : lk);\n  }\n  sh.getRange(r, T.d + 1).setValue(q.ket || '');\n  sh.getRange(r, T.k + 1).setValue(nKel ? (pos ? nKel : -nKel) : '');\n  if (T.m != null) sh.getRange(r, T.m + 1).setValue(nMas || '');\n  return { kel: nKel, mas: nMas };\n}\n\n/* ---------- tambah catatan ---------- */\nfunction tambahPopulasi(ss, sh, q) {\n  var T = tabel(sh), last = barisTerakhir(T);\n  if (last < 0) throw new Error('Belum ada baris bertanggal di tabel populasi.');\n  var pos = last + 1;\n  while (pos < T.v.length && kosong(sel(T, pos, T.t)) && /:\\s*\\d+\\s*$/.test(String(sel(T, pos, T.d)))) pos++;\n  var sebab = (q.sebab || []).filter(function (s) { return s && s[0] && Number(s[1]) > 0; });\n  var n = 1 + sebab.length, r = pos + 1, bebas = true;\n  for (var i = pos; i < pos + n; i++) for (var j = T.t; j < T.t + T.w; j++) if (!kosong(sel(T, i, j)) || rumus(T, i, j)) bebas = false;\n  if (!bebas) sh.getRange(r, T.t + 1, n, T.w).insertCells(SpreadsheetApp.Dimension.ROWS);\n  sh.getRange(last + 1, T.t + 1, 1, T.w).copyTo(sh.getRange(r, T.t + 1, 1, T.w), SpreadsheetApp.CopyPasteType.PASTE_FORMAT, false);\n  var positif = keluarPositif(T, last), x = tulisBaris(sh, T, r, q, last, positif);\n  var hitung = angka(sel(T, last, T.p)) - x.kel + x.mas, jml = kosong(q.jml) ? hitung : Number(q.jml);\n  if (rumus(T, last, T.p) && jml === hitung) sh.getRange(r, T.p + 1).setFormula(rumusPopulasi(T, last, r, positif));\n  else sh.getRange(r, T.p + 1).setValue(jml);\n  sebab.forEach(function (s, i) {\n    sh.getRange(r + 1 + i, T.t + 1, 1, T.w).clearContent();\n    sh.getRange(r + 1 + i, T.d + 1).setValue(String(s[0]).trim() + ': ' + Number(s[1]));\n  });\n  SpreadsheetApp.flush();\n  return { ok: true, row: r, jml: sh.getRange(r, T.p + 1).getValue(), tab: sh.getName() };\n}\n\n/* ---------- ubah catatan ---------- */\nfunction ubahPopulasi(ss, sh, q) {\n  var T = tabel(sh), i = Number(q.row) - 1;\n  if (!(i > T.h) || !adaTanggal(sel(T, i, T.t))) throw new Error('Baris yang diubah tidak lagi berisi catatan populasi. Muat ulang data lalu coba lagi.');\n  var tz = ss.getSpreadsheetTimeZone(), lama = sel(T, i, T.t);\n  var tLama = lama instanceof Date ? Utilities.formatDate(lama, tz, 'yyyy-MM-dd') : (typeof lama === 'number' ? new Date(Date.UTC(1899, 11, 30) + lama * 864e5).toISOString().slice(0, 10) : '');\n  if (q.was && tLama && tLama !== q.was) throw new Error('Isi spreadsheet sudah berubah sejak terakhir dibaca. Tekan Perbarui data lalu ubah lagi.');\n  var prev = barisSebelum(T, i), positif = keluarPositif(T, i) || (prev >= 0 && keluarPositif(T, prev));\n  var adaRumus = !!rumus(T, i, T.p), x = tulisBaris(sh, T, i + 1, q, prev >= 0 ? prev : i, positif), catatan = '';\n  if (!adaRumus) {\n    var hitung = prev >= 0 ? angka(sel(T, prev, T.p)) - x.kel + x.mas : angka(sel(T, i, T.p));\n    var jml = kosong(q.jml) ? hitung : Number(q.jml);\n    var sebelum = angka(sel(T, i, T.p));\n    sh.getRange(i + 1, T.p + 1).setValue(jml);\n    if (jml !== sebelum) for (var j = i + 1; j < T.v.length; j++) if (adaTanggal(sel(T, j, T.t)) && !rumus(T, j, T.p)) { catatan = 'Kolom Populasi di baris berikutnya diketik manual, jadi tidak ikut berubah. Periksa baris setelah tanggal ini.'; break; }\n  } else if (!kosong(q.jml)) {\n    SpreadsheetApp.flush();\n    if (Number(sh.getRange(i + 1, T.p + 1).getValue()) !== Number(q.jml)) catatan = 'Populasi dihitung oleh rumus di spreadsheet, jadi angka yang diketik tidak dipakai.';\n  }\n  SpreadsheetApp.flush();\n  return { ok: true, row: i + 1, jml: sh.getRange(i + 1, T.p + 1).getValue(), note: catatan, tab: sh.getName() };\n}\n";

function dl(name,text,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-ec],[data-eg],[data-newc],[data-newg],[data-savec],[data-delc],[data-saveg],[data-delg],[data-close],[data-fg],[data-fst],[data-nav]"),id=e.target.id;
  if(e.target.id==="sheet"){$("sheet").classList.remove("on");return}
  if(id==="bkp"){dl("cadangan_dashboard_gh_"+todayS()+".json",JSON.stringify(D),"application/json");return}
  if(id==="csv"){var r=[["Greenhouse","Siklus","Status","Varietas","Semai","Tanam","Panen mulai","Panen selesai","Populasi","Buah","Hasil (kg)","Target (kg)","Catatan"]];
    D.cycles.forEach(function(c){var g=ghOf(c.gh);r.push([g?g.nama:c.gh,c.nama,SLAB[stat(c)],c.var,c.semai,c.tanam,c.panenMulai,c.panenSelesai,c.popAkhir||c.popTanam||c.popTarget,c.buah,c.hasilKg,c.targetKg,c.catatan])});
    dl("siklus_greenhouse_"+todayS()+".csv","﻿"+r.map(function(x){return x.map(function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n"),"text/csv");return}
  if(id==="rst"){if(confirm("Kembalikan ke data awal? Semua perubahan Anda akan hilang.")){D=JSON.parse(JSON.stringify(SEED));save();renderAll();toast("Data awal dipulihkan")}return}
  if(!el)return;var ds=el.dataset;
  if(ds.nav){go(ds.nav);return}
  if(ds.close){$("sheet").classList.remove("on");return}
  if(ds.ec){openCycle(ds.ec);return}if(ds.eg){openGH(ds.eg);return}if(ds.newc){openCycle(null,ds.newc);return}if(ds.newg){openGH(null);return}
  if(ds.fg!==undefined){fG=ds.fg;renderSiklus();return}if(ds.fst!==undefined){fS=ds.fst;renderSiklus();return}
  if(ds.savec!==undefined){var c=ds.savec?cyOf(ds.savec):{id:"c"+Date.now()};readForm(CF,c);c.gh=document.querySelector('#sin [data-f="gh"]').value;c.status=document.querySelector('#sin [data-f="status"]').value;c.catatan=document.querySelector('#sin [data-f="catatan"]').value;shSave(c);
    if(!c.nama){toast("Isi nama siklus");return}if(!ds.savec)D.cycles.push(c);save();$("sheet").classList.remove("on");renderAll();toast("Tersimpan");if(c.sheet&&!syOf(c))syncCycle(c).then(renderAll);return}
  if(ds.delc){if(confirm("Hapus siklus ini?")){delete SY[ds.delc];saveSY();D.cycles=D.cycles.filter(function(x){return x.id!==ds.delc});save();$("sheet").classList.remove("on");renderAll()}return}
  if(ds.saveg!==undefined){var g=ds.saveg?ghOf(ds.saveg):{id:"g"+Date.now()};readForm(GF,g);if(!g.nama){toast("Isi nama greenhouse");return}if(!ds.saveg)D.ghs.push(g);save();$("sheet").classList.remove("on");renderAll();toast("Tersimpan");return}
  if(ds.delg){var n=D.cycles.filter(function(x){return x.gh===ds.delg}).length;if(confirm("Hapus greenhouse ini"+(n?" beserta "+n+" siklusnya":"")+"?")){D.ghs=D.ghs.filter(function(x){return x.id!==ds.delg});D.cycles=D.cycles.filter(function(x){return x.gh!==ds.delg});save();$("sheet").classList.remove("on");renderAll()}return}
});
document.addEventListener("change",function(e){if(e.target.id==="imp"){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.ghs||!d.cycles)throw 0;if(confirm("Ganti semua data dengan cadangan?")){D=d;save();renderAll();toast("Data dipulihkan")}}catch(x){toast("File cadangan tidak valid")}};r.readAsText(f)}});

function go(t){document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x.dataset.t===t)});document.querySelectorAll(".tab").forEach(function(s){s.classList.toggle("on",s.id==="t-"+t)});window.scrollTo(0,0);renderAll()}

  if(on==="t-pop")renderPop();else if(on==="t-mon")renderMon();else if(on==="t-ring")renderRing();else if(on==="t-siklus")renderSiklus();else if(on==="t-gh")renderGH();else renderAtur();
  $("sdate").textContent=fd(todayS());syncUI()}
